name: Change how I'm listed
description: For sponsors - choose how your name appears on the DigiNode Tools sponsors page
title: "Change how I'm listed"
labels: ["patron-listing"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for supporting DigiNode Tools! Public sponsors appear on the [diginode.tools/sponsors](https://diginode.tools/sponsors/) page - Patrons at the top, and everyone else under "Recent supporters" for a while after they join or donate. By default you're shown by name, linked to your GitHub profile. You can change that here, and it takes effect within a few minutes.

  - type: input
    id: sponsor_account
    attributes:
      label: Sponsoring GitHub account
      description: The GitHub user or organisation that sponsors DigiNode Tools. Leave blank if it's your own account. If it's an organisation, you must be a public member of it.
      placeholder: e.g. my-company
    validations:
      required: false

  - type: dropdown
    id: listing
    attributes:
      label: How should you be listed?
      options:
        - My name, linked to my GitHub profile
        - My name only, without a link
        - A nickname (enter it below)
        - As "A supporter", without a name
        - Don't list me
    validations:
      required: true

  - type: input
    id: nickname
    attributes:
      label: Nickname
      description: Only if you chose "A nickname". Up to 30 letters, numbers, spaces and simple punctuation.
      placeholder: e.g. Node Runner from Norway
    validations:
      required: false

  - type: checkboxes
    id: amount
    attributes:
      label: Amount
      options:
        - label: Don't show how much I gave (for one-time donations)
          required: false
